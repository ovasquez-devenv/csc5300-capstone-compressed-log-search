[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logsieve"
version = "0.1.0"
description = "Compressed full-text index for security log search (FM-index on the Burrows-Wheeler Transform)."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Omar Vasquez" }]
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
notebook = [
    "nbformat>=5.9",
    "nbclient>=0.9",
    "jupyter>=1.0",
    "nbconvert>=7.0",
]
test = ["pytest>=7.4"]

[project.scripts]
logsieve = "logsieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
